<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Independent security researcher focused on web application security, including XSS and access control.">
    <title>Kyle Huang</title>
    <link rel="icon" type="image/png" href="./avatar.png">
    <style>
      * { box-sizing: border-box; }
      html { background: #000; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 3rem 1.5rem; }
      main { width: 100%; max-width: 34rem; text-align: center; }
      img { display: block; width: clamp(8rem, 32vw, 11rem); max-width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 50%; margin: 0 auto 2rem; }
      h1 { margin: 0 0 1rem; font-size: clamp(2.25rem, 1.75rem + 2vw, 3.25rem); line-height: 1.15; font-weight: 650; letter-spacing: -0.04em; }
      p { margin: 0 auto; max-width: 32rem; color: #aaa; font-size: 1.0625rem; line-height: 1.75; overflow-wrap: break-word; }
    </style>
  </head>
  <body>
    <main>
      <img src="./avatar.png" width="1236" height="1237" alt="My illustrated avatar" fetchpriority="high">
      <h1>Kyle Huang</h1>
      <p>Independent security researcher focused on web application security, including XSS and access control.</p>
    </main>
  </body>
</html>
